name: Refresh contributions and deploy portfolio

on:
  push:
    branches: [main]
  schedule:
    # Offset from the top of the hour to reduce scheduler congestion.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Fetch current public contribution calendar
        run: python3 scripts/refresh-contributions.py
      - name: Build portfolio
        run: npm run build
      - name: Verify calendar and dock
        run: npm test
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
